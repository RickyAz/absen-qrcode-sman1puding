<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi QR Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col justify-between">

  <header class="bg-blue-600 text-white p-4 shadow-md text-center font-bold text-xl">
    SISTEM ABSENSI SCANNER KARTU QR CODE
  </header>

  <main class="container mx-auto p-4 flex-grow flex flex-col items-center justify-center">
    
    <div class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg text-center mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-3">Silakan Dekatkan Kartu Anda ke Kamera</h2>
      
      <div id="reader" class="w-full bg-gray-50 rounded-lg overflow-hidden border-2 border-dashed border-gray-300"></div>
      
      <div id="status-box" class="mt-4 p-3 hidden rounded-lg text-sm font-bold"></div>
      
      <button onclick="aktifkanKamera()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition shadow">
        Mulai Scan
      </button>
    </div>

    <div class="w-full max-w-md bg-white p-4 rounded-xl shadow border text-center">
      <p class="text-xs text-gray-500">Database & Management dikelola langsung via Google Sheets.</p>
    </div>

  </main>

  <script>
    // !!! GANTI DENGAN URL WEB APP GOOGLE SCRIPT ANDA !!!
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw08x2s3HKRaIv8W8v1SkI70uthiKuK9b0l-6zSNDlYukizopCSD8WyP0no8uUS0Iz_Iw/exec"; 

    let html5QrcodeScanner;

    function aktifkanKamera() {
      document.getElementById('reader').innerHTML = "";
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 }, false);
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText) {
      // Matikan scanner sementara agar tidak membaca ganda
      html5QrcodeScanner.clear();
      
      const statusBox = document.getElementById("status-box");
      statusBox.className = "mt-4 p-3 rounded-lg text-sm font-bold bg-yellow-100 text-yellow-800 block";
      statusBox.innerText = "Mengecek ID Kartu...";

      // Kirim data ke Google Sheets
      fetch(GAS_URL + "?action=scanAbsensi", {
        method: "POST",
        body: JSON.stringify({ idSiswa: decodedText })
      })
      .then(res => res.json())
      .then(response => {
        statusBox.classList.remove("bg-yellow-100", "text-yellow-800");
        if(response.success) {
          statusBox.className = "mt-4 p-3 rounded-lg text-sm font-bold bg-green-100 text-green-800 block";
          statusBox.innerText = response.message;
        } else {
          statusBox.className = "mt-4 p-3 rounded-lg text-sm font-bold bg-red-100 text-red-800 block";
          statusBox.innerText = response.message;
        }
        // Hidupkan kamera kembali setelah 3 detik untuk siswa selanjutnya
        setTimeout(aktifkanKamera, 3000);
      })
      .catch(err => {
        statusBox.className = "mt-4 p-3 rounded-lg text-sm font-bold bg-red-100 text-red-800 block";
        statusBox.innerText = "Gagal terhubung ke Server.";
        setTimeout(aktifkanKamera, 3000);
      });
    }

    function onScanFailure(error) {
      // Diabaikan saja agar console tidak penuh
    }
  </script>
</body>
</html>
