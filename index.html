<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi QR Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background-color: white !important; padding: 0; }
      .print-area { width: 100% !important; max-width: 100% !important; box-shadow: none !important; padding: 0 !important; }
      .print-only { display: inline !important; }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col justify-between">

  <header class="no-print bg-blue-600 text-white p-4 shadow-md text-center font-bold text-xl">
    SISTEM ABSENSI SCANNER KARTU QR CODE
  </header>

  <main class="container mx-auto p-4 flex-grow flex flex-col items-center justify-center">
    
    <div id="scanner-section" class="no-print w-full max-w-md bg-white p-6 rounded-xl shadow-lg text-center mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-3">Silakan Dekatkan Kartu Anda ke Kamera</h2>
      <div id="reader" class="w-full bg-gray-50 rounded-lg overflow-hidden border-2 border-dashed border-gray-300"></div>
      <div id="status-box" class="mt-4 p-3 hidden rounded-lg text-sm font-bold"></div>
      <button onclick="aktifkanKamera()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition shadow">
        Mulai Scan
      </button>
    </div>

    <div class="print-area w-full max-w-4xl bg-white p-6 rounded-xl shadow-md mb-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4 border-b pb-4">
        <div>
          <h2 class="text-xl font-bold text-gray-800 tracking-wide">REKAP KEHADIRAN SISWA</h2>
          <p id="info-tanggal" class="text-sm font-semibold text-gray-500 mt-1"></p>
        </div>
        
        <div class="no-print flex flex-wrap items-center gap-2">
          <input type="date" id="filter-tanggal" class="p-2 border rounded-lg text-sm font-medium focus:outline-none focus:border-blue-500">
          <button onclick="cariRiwayatTanggal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition">
            Cari Riwayat
          </button>
          <button onclick="kembaliKeHariIni()" id="btn-hari-ini" class="hidden bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition">
            Hari Ini
          </button>
          <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg text-sm shadow transition">
            🖨️ Cetak
          </button>
        </div>
      </div>

      <div id="stat-box" class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4 text-center text-xs font-bold text-gray-700">
        <div class="bg-gray-100 p-2 rounded-lg border">Siswa: <span id="stat-total" class="text-gray-900 text-sm">0</span></div>
        <div class="bg-green-50 p-2 rounded-lg border border-green-200 text-green-700">Hadir: <span id="stat-hadir" class="text-green-900 text-sm">0</span></div>
        <div class="bg-yellow-50 p-2 rounded-lg border border-yellow-200 text-yellow-700">Sakit: <span id="stat-sakit" class="text-yellow-900 text-sm">0</span></div>
        <div class="bg-blue-50 p-2 rounded-lg border border-blue-200 text-blue-700">Izin: <span id="stat-izin" class="text-blue-900 text-sm">0</span></div>
        <div class="bg-red-50 p-2 rounded-lg border border-red-200 text-red-700">Alpa: <span id="stat-alpa" class="text-red-900 text-sm">0</span></div>
      </div>

      <div class="no-print mb-4">
        <input type="text" id="cari-nama" onkeyup="filterNamaSiswa()" placeholder="🔍 Cari nama siswa di tabel..." class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 border-b-2 border-gray-200">
              <th class="p-3 text-sm font-bold text-gray-600 uppercase">Waktu</th>
              <th class="p-3 text-sm font-bold text-gray-600 uppercase">ID Siswa</th>
              <th class="p-3 text-sm font-bold text-gray-600 uppercase">Nama Siswa</th>
              <th class="p-3 text-sm font-bold text-gray-600 uppercase text-center">Status</th>
            </tr>
          </thead>
          <tbody id="tabel-body">
            <tr>
              <td colspan="4" class="text-center p-4 text-gray-400">Menghubungkan ke database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="no-print w-full max-w-4xl bg-white p-4 rounded-xl shadow border text-center">
      <p class="text-xs text-gray-500">Database & Management dikelola langsung via Google Sheets.</p>
    </div>

  </main>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwU0XUPR6aLvwZcQn1uShuacSIZxjGKPED-CNz8EYwfh88P2Z6eoSJN82A22Mto6LI6LA/exec"; 
    let html5QrcodeScanner;
    let autoRefreshInterval;
    let modeHariIni = true;

    window.onload = function() {
      const hariIni = new Date();
      document.getElementById('info-tanggal').innerText = "Hari/Tanggal: " + hariIni.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('filter-tanggal').value = hariIni.toISOString().split('T')[0];
      muatSemuaDataHariIni();
      
      // Jalankan Auto-Refresh setiap 15 detik khusus untuk mode Hari Ini
      autoRefreshInterval = setInterval(function() {
        if(modeHariIni) muatSemuaDataHariIni(true); 
      }, 15000);
    };

    function aktifkanKamera() {
      document.getElementById('reader').innerHTML = "";
      html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", { fps: 10, qrbox: 250, facingMode: "environment" }, false
      );
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText) {
      html5QrcodeScanner.clear();
      const statusBox = document.getElementById("status-box");
      statusBox.className = "mt-4 p-3 rounded-lg text-sm font-bold bg-yellow-100 text-yellow-800 block";
      statusBox.innerText = "Mengecek ID Kartu...";

      fetch(GAS_URL + "?action=scanAbsensi", {
        method: "POST",
        body: JSON.stringify({ idSiswa: decodedText })
      })
      .then(res => res.json())
      .then(response => {
        if(response.success) {
          statusBox.className = "mt-4 p-3 rounded-lg text-sm font-bold bg-green-100 text-green-800 block";
          statusBox.innerText = response.message;
          muatSemuaDataHariIni();
        } else {
          statusBox.className = "mt-4 p-3 rounded-lg text-sm font-bold bg-red-100 text-red-800 block";
          statusBox.innerText = response.message;
        }
        setTimeout(aktifkanKamera, 3000);
      })
      .catch(err => {
        statusBox.className = "mt-4 p-3 rounded-lg text-sm font-bold bg-red-100 text-red-800 block";
        statusBox.innerText = "Gagal terhubung ke Server.";
        setTimeout(aktifkanKamera, 3000);
      });
    }

    function onScanFailure(error) {}

    // RUMUS MENGUPDATE PANEL COUNTER STATISTIK
    function updateStatistik(data) {
      let total = data.length;
      let hadir = data.filter(i => i.status === "Hadir").length;
      let sakit = data.filter(i => i.status === "Sakit").length;
      let izin = data.filter(i => i.status === "Izin").length;
      let alpa = data.filter(i => i.status === "Alpa").length;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-hadir').innerText = hadir;
      document.getElementById('stat-sakit').innerText = sakit;
      document.getElementById('stat-izin').innerText = izin;
      document.getElementById('stat-alpa').innerText = alpa;
    }

    // FITUR FILTER PENCARIAN NAMA REALTIME
    function filterNamaSiswa() {
      let input = document.getElementById("cari-nama").value.toLowerCase();
      let rows = document.querySelectorAll("#tabel-body tr");
      
      rows.forEach(row => {
        let namaSiswa = row.querySelector("td:nth-child(3)");
        if (namaSiswa) {
          let textValue = namaSiswa.textContent || namaSiswa.innerText;
          row.style.display = textValue.toLowerCase().indexOf(input) > -1 ? "" : "none";
        }
      });
    }

    function cariRiwayatTanggal() {
      const tanggalDipilih = document.getElementById('filter-tanggal').value;
      if (!tanggalDipilih) return alert("Silakan pilih tanggal terlebih dahulu!");

      const hariIniString = new Date().toISOString().split('T')[0];
      if (tanggalDipilih !== hariIniString) {
        modeHariIni = false;
        document.getElementById('scanner-section').classList.add('hidden');
        document.getElementById('btn-hari-ini').classList.remove('hidden');
        if (html5QrcodeScanner) { html5QrcodeScanner.clear(); }
      } else {
        kembaliKeHariIni();
        return;
      }

      const tabelBody = document.getElementById('tabel-body');
      tabelBody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-gray-400">Mencari arsip riwayat absensi...</td></tr>';

      const opsiTgl = new Date(tanggalDipilih).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('info-tanggal').innerText = "Arsip Rekap: " + opsiTgl;

      fetch(GAS_URL + "?action=getAbsensiByTanggal", {
        method: "POST",
        body: JSON.stringify({ tanggal: tanggalDipilih })
      })
      .then(res => res.json())
      .then(data => {
        tabelBody.innerHTML = "";
        updateStatistik(data);
        if (!data || data.length === 0) {
          tabelBody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-gray-400">Tidak ada riwayat data absensi pada tanggal ini.</td></tr>';
          return;
        }
        
        data.forEach(item => {
          let badgeStatus = "";
          if (item.status === "Hadir") badgeStatus = `<span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-extrabold">Hadir</span>`;
          else if (item.status === "Sakit") badgeStatus = `<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-extrabold">Sakit</span>`;
          else if (item.status === "Izin") badgeStatus = `<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-extrabold">Izin</span>`;
          else if (item.status === "Alpa") badgeStatus = `<span class="bg-red-100 text-red-800 px-3 py-1 rounded-full text-xs font-extrabold">Alpa</span>`;

          const barisHtml = `<tr class="border-b border-gray-100 hover:bg-gray-50 transition">
            <td class="p-3 text-gray-700 font-semibold">${item.waktu}</td>
            <td class="p-3 text-gray-600 font-mono">${item.id}</td>
            <td class="p-3 font-bold text-gray-800">${item.nama}</td>
            <td class="p-3 text-center">${badgeStatus}</td>
          </tr>`;
          tabelBody.insertAdjacentHTML('beforeend', barisHtml);
        });
        filterNamaSiswa(); // Tetap terapkan pencarian jika input terisi
      });
    }

    function kembaliKeHariIni() {
      modeHariIni = true;
      const hariIni = new Date();
      document.getElementById('info-tanggal').innerText = "Hari/Tanggal: " + hariIni.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('filter-tanggal').value = hariIni.toISOString().split('T')[0];
      
      document.getElementById('scanner-section').classList.remove('hidden');
      document.getElementById('btn-hari-ini').classList.add('hidden');
      
      muatSemuaDataHariIni();
    }

    function muatSemuaDataHariIni(isSilent = false) {
      const tabelBody = document.getElementById('tabel-body');
      if(!isSilent) {
        tabelBody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-gray-400">Sinkronisasi data harian...</td></tr>';
      }

      fetch(GAS_URL + "?action=getAbsensiHariIni", {
        method: "POST",
        body: JSON.stringify({})
      })
      .then(res => res.json())
      .then(data => {
        tabelBody.innerHTML = "";
        updateStatistik(data);
        data.forEach(item => {
          let badgeStatus = "";
          if (item.status === "Hadir") {
            badgeStatus = `<span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-extrabold">Hadir</span>`;
          } else if (item.status === "Sakit") {
            badgeStatus = `<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-extrabold">Sakit</span>`;
          } else if (item.status === "Izin") {
            badgeStatus = `<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-extrabold">Izin</span>`;
          } else if (item.status === "Alpa") {
            badgeStatus = `<span class="bg-red-100 text-red-800 px-3 py-1 rounded-full text-xs font-extrabold">Alpa</span>`;
          } else {
            badgeStatus = `
              <div class="no-print flex items-center justify-center">
                <select onchange="gantiStatusManual('${item.id}', this.value)" class="text-xs bg-gray-50 border border-gray-300 rounded p-1 font-semibold focus:outline-none focus:ring-1 focus:ring-blue-500">
                  <option value="" disabled selected>Pilih...</option>
                  <option value="Sakit">Sakit</option>
                  <option value="Izin">Izin</option>
                  <option value="Alpa">Alpa</option>
                </select>
              </div>
              <span class="print-only hidden text-xs text-red-500 font-bold">Belum Absen</span>
            `;
          }

          const barisHtml = `<tr class="border-b border-gray-100 hover:bg-gray-50 transition">
            <td class="p-3 text-gray-700 font-semibold">${item.waktu}</td>
            <td class="p-3 text-gray-600 font-mono">${item.id}</td>
            <td class="p-3 font-bold text-gray-800">${item.nama}</td>
            <td class="p-3 text-center">${badgeStatus}</td>
          </tr>`;
          tabelBody.insertAdjacentHTML('beforeend', barisHtml);
        });
        filterNamaSiswa();
      });
    }

    function gantiStatusManual(idSiswa, statusPilihan) {
      if (!statusPilihan) return;
      const statusBox = document.getElementById("status-box");
      statusBox.className = "no-print mt-4 p-3 rounded-lg text-sm font-bold bg-yellow-100 text-yellow-800 block";
      statusBox.innerText = "Memperbarui status di Google Sheets...";

      fetch(GAS_URL + "?action=ubahStatusManual", {
        method: "POST",
        body: JSON.stringify({ idSiswa: idSiswa, statusBaru: statusPilihan })
      })
      .then(res => res.json())
      .then(response => {
        if (response.success) {
          statusBox.className = "no-print mt-4 p-3 rounded-lg text-sm font-bold bg-green-100 text-green-800 block";
          statusBox.innerText = response.message;
          muatSemuaDataHariIni();
        }
      });
    }
  </script>
</body>
</html>
